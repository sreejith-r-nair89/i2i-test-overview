<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #111418; color: #e6e8eb; padding: 2rem; }
  header { max-width: 1400px; margin: 0 auto 1.5rem; }
  h1 { font-size: 1.6rem; font-weight: 650; }
  header p { color: #9aa3ad; margin-top: .35rem; font-size: .95rem; }
  nav { max-width: 1400px; margin: 0 auto 2rem; display: flex; gap: .4rem; flex-wrap: wrap; }
  nav a { color: #cfe3ff; background: #1c2128; border: 1px solid #2d333b; border-radius: 6px; padding: .25rem .7rem; text-decoration: none; font-size: .9rem; }
  nav a:hover { background: #2d333b; }
  main { max-width: 1400px; margin: 0 auto; }
  section { margin-bottom: 2.5rem; }
  h2 { font-size: 1.1rem; font-weight: 600; color: #adbac7; margin-bottom: .8rem; border-bottom: 1px solid #2d333b; padding-bottom: .4rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1rem; }
  figure { background: #1c2128; border: 1px solid #2d333b; border-radius: 10px; overflow: hidden; }
  figure img { display: block; width: 100%; height: auto; background: #0d1117; }
  figcaption { padding: .55rem .8rem; font-size: .85rem; color: #9aa3ad; display: flex; align-items: center; gap: .5rem; }
  .step { display: inline-flex; align-items: center; justify-content: center; width: 1.3rem; height: 1.3rem; border-radius: 50%; background: #316dca; color: #fff; font-size: .75rem; font-weight: 700; flex: none; }
</style>
